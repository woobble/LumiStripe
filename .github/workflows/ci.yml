name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # The test suite exercises the native DSP backend explicitly. Release
      # builds are covered separately below with the default pure-Python
      # profile and each supported native profile.
      LUMISTRIPE_BUILD_EXTENSIONS: audio
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Type check Python
        run: >-
          uv run mypy
          packages/lumistripe-core/src/lumistripe
          apps/lumistripe-cli/src/lumistripe_cli
          apps/lumistripe-sim/src/lumistripe_sim
          apps/lumistripe-web/src/lumistripe_web
          packages/lumistripe-app-support/src/lumistripe_app_support

      - name: Test Python
        run: uv run python -m pytest -q --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          flags: py3.12
          name: coverage-3.12
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: matrix.python-version == '3.12' && !cancelled() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./junit.xml
          token: ${{ env.CODECOV_TOKEN }}
          flags: py3.12
          name: test-results-3.12
          report_type: test_results
          fail_ci_if_error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lumistripe-web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify generated REST contract
        run: bun run generate:api && git diff --exit-code -- openapi.json src/generated/api.ts

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Build Python distributions
        working-directory: .
        run: uv build --all-packages --out-dir dist

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  core-distributions:
    name: Core ${{ matrix.profile }} distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [none, audio, all]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install native audio dependencies
        if: matrix.profile == 'audio' || matrix.profile == 'all'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev

      - name: Build core wheel and source distribution
        env:
          LUMISTRIPE_BUILD_EXTENSIONS: ${{ matrix.profile }}
        run: uv build --package lumistripe-core --out-dir "dist/${{ matrix.profile }}"

      - name: Verify wheel profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          profile = os.environ["PROFILE"]
          wheel = next(Path("dist", profile).glob("*.whl"))
          with ZipFile(wheel) as archive:
              has_native = any(name.endswith(".so") for name in archive.namelist())
          expected = profile != "none"
          if has_native != expected:
              raise SystemExit(
                  f"profile {profile!r}: native extension presence {has_native}, expected {expected}"
              )
          PY

  raspberry-pi:
    name: Raspberry Pi 5 arm64 native smoke
    # This runner is a persistent home/device host. Keep untrusted pull request
    # code on the hosted runners above and use the RPi only for trusted pushes
    # and explicit manual validation.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, ARM64, rpi5]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify Raspberry Pi runner
        run: |
          set -eu
          test "$(uname -m)" = "aarch64"
          python3 --version
          uname -a
          if test -f /etc/os-release; then
            cat /etc/os-release
          fi
          command -v cc
          command -v make
          cc --version
          git submodule status --recursive

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify build environment
        run: |
          set -eu
          uv --version
          uv run python -c 'import platform, sys; assert sys.version_info[:2] == (3, 12); print(platform.platform())'

      - name: Install Raspberry Pi native profile
        env:
          LUMISTRIPE_BUILD_EXTENSIONS: all
        run: uv sync --locked --all-extras --dev

      - name: Test native core on arm64
        env:
          LUMISTRIPE_BUILD_EXTENSIONS: all
        run: uv run python -m pytest -q packages/lumistripe-core/tests

      - name: Build and verify arm64 core distributions
        env:
          LUMISTRIPE_BUILD_EXTENSIONS: all
        run: |
          uv build --package lumistripe-core --out-dir dist/raspberry-pi
          uv run python - <<'PY'
          import platform
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          if platform.machine() != "aarch64":
              raise SystemExit(f"unexpected machine: {platform.machine()}")

          output = Path("dist/raspberry-pi")
          wheels = list(output.glob("*.whl"))
          sdists = list(output.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and sdist, found {wheels} and {sdists}")

          with ZipFile(wheels[0]) as archive:
              native = [name for name in archive.namelist() if name.endswith(".so")]
              if not native:
                  raise SystemExit("arm64 wheel does not contain native extensions")

          required_sources = {
              "kiss_fft.c",
              "kiss_fft.h",
              "kiss_fftr.c",
              "kiss_fftr.h",
              "_kiss_fft_guts.h",
          }
          with tarfile.open(sdists[0], "r:gz") as archive:
              bundled = {
                  Path(name).name
                  for name in archive.getnames()
                  if "/src/lumistripe/audio/kissfft/" in name
              }
          missing = required_sources - bundled
          if missing:
              raise SystemExit(f"sdist is missing KISS FFT sources: {sorted(missing)}")
          print(f"verified {len(native)} native extensions and KISS FFT sources")
          PY
