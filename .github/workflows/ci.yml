name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment-tests:
    name: Deployment regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.13.5"

      - name: Test deployment scripts and service templates
        run: uv run --no-project --with pytest python -m pytest -q deploy/tests

  frontend:
    name: Frontend contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    defaults:
      run:
        working-directory: apps/lumistripe-web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Verify Rust toolchain
        run: |
          cargo --version
          rustc --version | grep -Eq '^rustc 1\.88\.0([[:space:]]|$)'

      - name: Install Rust OpenAPI exporter dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated REST contract
        run: bun run generate:api && git diff --exit-code -- openapi.json src/generated/api.ts

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

  rust-engine:
    name: Rust engine x86_64 (MSRV 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy

      - name: Verify Rust toolchain
        run: |
          cargo --version
          rustc --version | grep -Eq '^rustc 1\.88\.0([[:space:]]|$)'

      - name: Install CPAL Linux host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build Rust engine for web integration tests
        run: cargo build --locked --package lumistripe-engine --bin lumistripe-engine

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Test Rust CLI with Python unavailable
        run: >-
          cargo test --locked
          --package lumistripe-cli --features test-engine

      - name: Test Rust web with native Bluetooth and PipeWire providers
        run: >-
          cargo test --locked
          --package lumistripe-web --features bluez,pipewire

      - name: Build standalone Rust engine
        run: cargo build --release --locked --workspace

      - name: Build Rust web with native Bluetooth and PipeWire providers
        run: >-
          cargo build --release --locked
          --package lumistripe-web --features bluez,pipewire

  rust-engine-arm64:
    name: Rust engine Linux ARM64 (MSRV 1.88)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt

      - name: Verify ARM64 Rust toolchain
        run: |
          command -v cargo
          command -v rustc
          test "$(uname -m)" = "aarch64"
          rustc --version | grep -Eq '^rustc 1\.88\.0([[:space:]]|$)'
          rustc -vV | tee "$RUNNER_TEMP/rustc-version.txt"
          test "$(sed -n 's/^host: //p' "$RUNNER_TEMP/rustc-version.txt")" = "aarch64-unknown-linux-gnu"
          cargo --version

      - name: Install CPAL Linux host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Build Rust engine for web integration tests
        run: cargo build --locked --package lumistripe-engine --bin lumistripe-engine

      - name: Test Rust workspace on ARM64
        run: cargo test --locked --workspace

      - name: Test Rust CLI with Python unavailable on ARM64
        run: >-
          cargo test --locked
          --package lumistripe-cli --features test-engine

      - name: Test Rust web native Bluetooth and PipeWire providers on ARM64
        run: >-
          cargo test --locked
          --package lumistripe-web --features bluez,pipewire

      - name: Build and verify ARM64 engine
        run: |
          cargo build --release --locked --workspace
          file target/release/lumistripe-engine | grep -q 'ARM aarch64'

      - name: Build and verify ARM64 Rust web native providers
        run: |
          cargo build --release --locked \
            --package lumistripe-web --features bluez,pipewire
          file target/release/lumistripe-web | grep -q 'ARM aarch64'

  raspberry-pi:
    name: Raspberry Pi 5 arm64 native smoke
    # This runner is a persistent home/device host. Keep untrusted pull request
    # code on the hosted runners above and use the RPi only for trusted pushes
    # to main and explicit manual validation dispatched from main.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, linux, ARM64, rpi5]
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install Raspberry Pi native build dependencies
        run: bash scripts/provision_rpi_ci_native_deps.sh

      - name: Verify Raspberry Pi runner
        run: |
          set -eu
          test "$(uname -m)" = "aarch64"
          uname -a
          if test -f /etc/os-release; then
            cat /etc/os-release
          fi
          command -v cc
          command -v make
          command -v rustup
          command -v cargo
          command -v rustc
          command -v pkg-config
          cc --version
          rustc -vV | tee "$RUNNER_TEMP/rustc-version.txt"
          rustc --version | grep -Eq '^rustc 1\.88\.0([[:space:]]|$)'
          rust_host="$(sed -n 's/^host: //p' "$RUNNER_TEMP/rustc-version.txt")"
          test "$rust_host" = "aarch64-unknown-linux-gnu"
          cargo --version
          native_root="${LUMI_RPI_NATIVE_DEPS_ROOT:-}"
          test -s "${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}"
          test -f "$native_root/usr/include/alsa/asoundlib.h"
          pkg-config --exists dbus-1
          pkg-config --exists libpipewire-0.3
          pkg-config --exists libpulse

      - name: Build Rust playback engine on Raspberry Pi
        run: >-
          cargo build --release --locked
          --package lumistripe-engine --bin lumistripe-engine

      - name: Build Rust engine for web integration tests on Raspberry Pi
        run: >-
          cargo build --locked
          --package lumistripe-engine --bin lumistripe-engine

      - name: Test Rust web with native Bluetooth and PipeWire providers on Raspberry Pi
        run: >-
          cargo test --locked
          --package lumistripe-web --features bluez,pipewire

      - name: Verify live BlueZ snapshot on Raspberry Pi
        run: |
          set -eu
          if systemctl is-active --quiet bluetooth.service; then
            cargo test --locked \
              --package lumistripe-web --features bluez,pipewire \
              -- --ignored --exact \
              bluetooth_bluer::tests::live_bluez_snapshot
          else
            printf 'BlueZ live snapshot skipped: bluetooth.service is inactive.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify live PipeWire snapshot on Raspberry Pi
        run: |
          set -eu
          runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          if test -S "$runtime_dir/pipewire-0"; then
            XDG_RUNTIME_DIR="$runtime_dir" cargo test --locked \
              --package lumistripe-web \
              --features bluez,pipewire \
              -- --ignored --exact pipewire_bindings::tests::live_pipewire_registry_snapshot
          else
            printf 'PipeWire live snapshot skipped: no user daemon socket at %s/pipewire-0.\n' \
              "$runtime_dir" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify live NetworkManager helper protocol on Raspberry Pi
        run: |
          set -eu
          if systemctl is-active --quiet NetworkManager.service \
            && command -v nmcli >/dev/null 2>&1 \
            && command -v iw >/dev/null 2>&1 \
            && test -x /usr/local/libexec/lumistripe/network/lumistripe-network-helper; then
            cargo test --locked \
              --package lumistripe-web --features bluez,pipewire \
              -- --ignored --exact \
              network::tests::live_networkmanager_status_decodes_read_only_helper_snapshot
          else
            printf 'NetworkManager live snapshot skipped: service or helper prerequisites are inactive.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify installed NetworkManager REST boundary on Raspberry Pi
        run: |
          set -eu
          target_dir="${CARGO_TARGET_DIR:-target}"
          test_name=app::tests::live_networkmanager_status_route_uses_installed_restricted_wrapper
          if systemctl is-active --quiet NetworkManager.service \
            && id -u www-data >/dev/null 2>&1 \
            && test -x /usr/local/sbin/lumistripe-network \
            && test -x /usr/local/libexec/lumistripe/network/lumistripe-network-helper \
            && sudo -n -l -U www-data 2>/dev/null \
              | grep -Fq /usr/local/sbin/lumistripe-network; then
            test_binary=
            for candidate in "$target_dir"/debug/deps/lumistripe_web-*; do
              if test -x "$candidate" \
                && "$candidate" --list 2>/dev/null | grep -Fq "$test_name"; then
                test_binary="$candidate"
                break
              fi
            done
            if test -z "$test_binary"; then
              printf 'NetworkManager REST live test binary was not built.\n' >&2
              exit 1
            fi
            service_home="$(getent passwd www-data | cut -d: -f6)"
            sudo -u www-data -- env \
              HOME="$service_home" \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              LUMISTRIPE_ENGINE_TEST_BINARY="$target_dir/debug/lumistripe-engine" \
              "$test_binary" "$test_name" --exact --ignored --test-threads=1
          else
            printf 'Installed NetworkManager REST boundary skipped: restricted helper or service prerequisites are unavailable.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify live native audio status through the web API on Raspberry Pi
        run: |
          set -eu
          runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          if systemctl is-active --quiet bluetooth.service \
            && test -S "$runtime_dir/pipewire-0" \
            && XDG_RUNTIME_DIR="$runtime_dir" pactl info >/dev/null 2>&1; then
            XDG_RUNTIME_DIR="$runtime_dir" cargo test --locked \
              --package lumistripe-web \
              --features bluez,pipewire \
              -- --ignored --exact \
              app::tests::live_native_audio_status_uses_system_providers_with_mock_outputs
          else
            printf 'Native audio API snapshot skipped: BlueZ, PipeWire, or PipeWire Pulse is inactive.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run opt-in live Raspberry Pi system, BlueZ, and Wi-Fi checks
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eu
          target_dir="${CARGO_TARGET_DIR:-target}"
          test_binary=
          for candidate in "$target_dir"/debug/deps/lumistripe_web-*; do
            if test -x "$candidate" \
              && "$candidate" --list 2>/dev/null \
                | grep -Fq bluetooth_bluer::tests::live_bluez_scan_completes_and_releases_discovery \
              && "$candidate" --list 2>/dev/null \
                | grep -Fq network::tests::live_networkmanager_scan_uses_the_restricted_wrapper \
              && "$candidate" --list 2>/dev/null \
                | grep -Fq system_stats::tests::live_linux_metrics_are_available; then
              test_binary="$candidate"
              break
            fi
          done
          if test -z "$test_binary"; then
            printf 'Live Raspberry Pi test binary was not built.\n' >&2
            exit 1
          fi

          "$test_binary" \
            system_stats::tests::live_linux_metrics_are_available \
            --exact --ignored --test-threads=1

          bluez_state="$(bluetoothctl show 2>/dev/null || true)"
          if systemctl is-active --quiet bluetooth.service \
            && printf '%s\n' "$bluez_state" | grep -Fq 'Powered: yes' \
            && printf '%s\n' "$bluez_state" | grep -Fq 'Discovering: no'; then
            "$test_binary" \
              bluetooth_bluer::tests::live_bluez_scan_completes_and_releases_discovery \
              --exact --ignored --test-threads=1
          else
            printf 'Live BlueZ scan skipped: adapter is inactive, unpowered, or already scanning.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if systemctl is-active --quiet NetworkManager.service \
            && test -e /sys/class/net/wlan0 \
            && test -x /usr/local/sbin/lumistripe-network \
            && id -u www-data >/dev/null 2>&1 \
            && sudo -n -l -U www-data 2>/dev/null \
              | grep -Fq /usr/local/sbin/lumistripe-network; then
            service_home="$(getent passwd www-data | cut -d: -f6)"
            sudo -u www-data -- env \
              HOME="$service_home" \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              "$test_binary" \
              network::tests::live_networkmanager_scan_uses_the_restricted_wrapper \
              --exact --ignored --test-threads=1
          else
            printf 'Live Wi-Fi scan skipped: wlan0, NetworkManager, or the restricted wrapper is unavailable.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-arm64-release:
    name: Publish verified ARM64 release
    if: >-
      ${{
        github.repository == 'woobble/LumiStripe' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    needs: [deployment-tests, frontend, rust-engine, rust-engine-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release source commit
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          if git ls-remote --exit-code --tags origin "refs/tags/build-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "A release tag already exists for $GITHUB_SHA; refusing to replace it." >&2
            exit 1
          fi

      - name: Build ARM64 binaries and frontend in Debian Trixie
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            --file deploy/docker/Dockerfile \
            --target release-output \
            --build-arg "BUN_VERSION=$(cat .bun-version)" \
            --build-arg "LUMI_RELEASE_COMMIT=$GITHUB_SHA" \
            --output "type=local,dest=$RUNNER_TEMP/lumistripe-release" \
            .
          test -x "$RUNNER_TEMP/lumistripe-release/release/lumistripe-web"
          test -x "$RUNNER_TEMP/lumistripe-release/release/lumistripe-engine"
          test -x "$RUNNER_TEMP/lumistripe-release/release/lumistripe"
          test -x "$RUNNER_TEMP/lumistripe-release/release/lumistripe-deploy-helper"
          test "$(cat "$RUNNER_TEMP/lumistripe-release/release/source-commit")" = "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/lumistripe-release/release/static/index.html"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.13.5"

      - name: Package deterministic release archive and manifest
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/lumistripe-release/release"
          archive_name="lumistripe-linux-aarch64-$GITHUB_SHA.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          uv run --no-project --python 3.12 python deploy/release_artifact.py package \
            --release-dir "$release_dir" \
            --output "$archive" \
            --commit "$GITHUB_SHA" \
            --project-root "$GITHUB_WORKSPACE" \
            --build-info "$RUNNER_TEMP/lumistripe-release/release-build-info.json"
          cp "$release_dir/manifest.json" "$archive.manifest.json"
          (cd "$RUNNER_TEMP" && sha256sum "$archive_name" > "$archive_name.sha256")
          echo "LUMI_RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Attest release archive provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.LUMI_RELEASE_ARCHIVE }}

      - name: Verify provenance and publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          archive="$LUMI_RELEASE_ARCHIVE"
          archive_name="${archive##*/}"
          checksum="$archive.sha256"
          manifest="$archive.manifest.json"
          bundle="${archive}.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "$bundle"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --bundle "$bundle"

          tag="build-$GITHUB_SHA"
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "LumiStripe $GITHUB_SHA" \
            --notes "Commit-matched ARM64 Debian Trixie deployment bundle." \
            "$archive" "$checksum" "$bundle" "$manifest"

          expected_assets="$(printf '%s\n' "$archive_name" "$archive_name.sha256" "$archive_name.sigstore.json" "$archive_name.manifest.json" | jq -R . | jq -s 'sort')"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable,assets \
            | jq -e --arg tag "$tag" --argjson assets "$expected_assets" \
              'select(.tagName == $tag and .isDraft == true and ([.assets[].name] | sort == $assets))' \
            >/dev/null
          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable \
            | jq -e --arg tag "$tag" \
              'select(.tagName == $tag and .isDraft == false and .isImmutable == true)' \
            >/dev/null
