name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_extended_stability:
        description: Run the bounded three-minute simulator stability profile
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment-tests:
    name: Deployment regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.13.5"

      - name: Test deployment scripts and service templates
        run: uv run --no-project --with pytest python -m pytest -q deploy/tests

  frontend:
    name: Frontend contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    defaults:
      run:
        working-directory: apps/lumistripe-web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Bun dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'apps/lumistripe-web/frontend/bun.lock') }}

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust 1.99.1 toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Verify Rust toolchain
        run: |
          cargo --version
          rustc --version | grep -Eq '^rustc 1\.99\.1([[:space:]]|$)'

      - name: Install Rust OpenAPI exporter dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated REST contract
        run: bun run generate:api && git diff --exit-code -- openapi.json src/generated/api.ts

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

  rust-engine:
    name: Rust engine x86_64 (MSRV 1.99)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      extended-stability: ${{ steps.extended-stability.outcome }}
      application-tests: ${{ steps.application-tests.outcome }}
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install MSRV Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Verify Rust toolchain
        run: |
          cargo --version
          rustc --version | grep -Eq '^rustc 1\.99\.1([[:space:]]|$)'

      - name: Install CPAL Linux host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build Rust engine for web integration tests
        run: cargo build --locked --package lumistripe-engine --bin lumistripe-engine

      - name: Test Rust workspace
        id: application-tests
        run: >-
          LUMISTRIPE_TRACE_BLUETOOTH_WIFI_TEST=1
          cargo test --locked --workspace -- --nocapture

      - name: Test Rust CLI with Python unavailable
        run: >-
          cargo test --locked
          --package lumistripe-cli --features test-engine

      - name: Test Rust web with native Bluetooth and PipeWire providers
        run: >-
          cargo test --locked
          --package lumistripe-web --features bluez,pipewire

      - name: Build standalone Rust engine
        run: cargo build --release --locked --workspace

      - name: Build Rust web with native Bluetooth and PipeWire providers
        run: >-
          cargo build --release --locked
          --package lumistripe-web --features bluez,pipewire

      - name: Install uv for the extended stability profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_stability }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.13.5"

      - name: Run the opt-in simulator stability profile
        id: extended-stability
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_stability }}
        run: |
          uv run --no-project --python 3.12 python deploy/stability_profile.py \
            --binary target/release/lumistripe-web \
            --duration-seconds 180 \
            --output "$RUNNER_TEMP/lumistripe-stability.json"

      - name: Upload stability profile report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended_stability && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-stability-${{ github.sha }}
          path: ${{ runner.temp }}/lumistripe-stability.json
          if-no-files-found: warn
          retention-days: 30

  rust-engine-arm64:
    name: Rust engine Linux ARM64 (MSRV 1.99)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install MSRV Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt

      - name: Verify ARM64 Rust toolchain
        run: |
          command -v cargo
          command -v rustc
          test "$(uname -m)" = "aarch64"
          rustc --version | grep -Eq '^rustc 1\.99\.1([[:space:]]|$)'
          rustc -vV | tee "$RUNNER_TEMP/rustc-version.txt"
          test "$(sed -n 's/^host: //p' "$RUNNER_TEMP/rustc-version.txt")" = "aarch64-unknown-linux-gnu"
          cargo --version

      - name: Install CPAL Linux host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libclang-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Build Rust engine for web integration tests
        run: cargo build --locked --package lumistripe-engine --bin lumistripe-engine

      - name: Test Rust workspace on ARM64
        run: >-
          LUMISTRIPE_TRACE_BLUETOOTH_WIFI_TEST=1
          cargo test --locked --workspace -- --nocapture

      - name: Test Rust CLI with Python unavailable on ARM64
        run: >-
          cargo test --locked
          --package lumistripe-cli --features test-engine

      - name: Test Rust web native Bluetooth and PipeWire providers on ARM64
        run: >-
          cargo test --locked
          --package lumistripe-web --features bluez,pipewire

      - name: Build and verify ARM64 engine
        run: |
          cargo build --release --locked --workspace
          file target/release/lumistripe-engine | grep -q 'ARM aarch64'

      - name: Build and verify ARM64 Rust web native providers
        run: |
          cargo build --release --locked \
            --package lumistripe-web --features bluez,pipewire
          file target/release/lumistripe-web | grep -q 'ARM aarch64'

  qualification-report:
    name: CI qualification report
    if: ${{ always() }}
    needs: [deployment-tests, frontend, rust-engine, rust-engine-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.13.5"

      - name: Generate CI qualification report
        env:
          DEPLOYMENT_TEST_RESULT: ${{ needs.deployment-tests.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend.result }}
          RUST_X86_TEST_RESULT: ${{ needs.rust-engine.result }}
          RUST_APPLICATION_TEST_RESULT: ${{ needs.rust-engine.outputs.application-tests || needs.rust-engine.result }}
          RUST_STABILITY_TEST_RESULT: ${{ needs.rust-engine.outputs.extended-stability || 'skipped' }}
          RUST_ARM64_TEST_RESULT: ${{ needs.rust-engine-arm64.result }}
        run: |
          set -eu
          report_dir="$RUNNER_TEMP/ci-qualification"
          uv run --no-project --python 3.12 python deploy/release_qualification.py \
            --project-root "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --deployment-tests "$DEPLOYMENT_TEST_RESULT" \
            --frontend-tests "$FRONTEND_TEST_RESULT" \
            --rust-x86-tests "$RUST_X86_TEST_RESULT" \
            --application-tests "$RUST_APPLICATION_TEST_RESULT" \
            --stability-tests "$RUST_STABILITY_TEST_RESULT" \
            --rust-arm64-tests "$RUST_ARM64_TEST_RESULT" \
            --release-source skipped \
            --release-smoke skipped \
            --trixie-runtime skipped \
            --ubuntu-2604-runtime skipped \
            --artifact-integrity skipped \
            --provenance skipped \
            --build-environment "GitHub-hosted Ubuntu 24.04 x86_64 and ARM64 runners" \
            --output-dir "$report_dir"
          cat "$report_dir/release-qualification.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI qualification report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/ci-qualification/
          if-no-files-found: error
          retention-days: 30

  publish-arm64-release:
    name: Publish verified ARM64 release
    if: >-
      ${{
        github.repository == 'woobble/LumiStripe' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    needs: [deployment-tests, frontend, rust-engine, rust-engine-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.13.5"

      - name: Verify release source commit
        id: verify_release_source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          if git ls-remote --exit-code --tags origin "refs/tags/build-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "A release tag already exists for $GITHUB_SHA; refusing to replace it." >&2
            exit 1
          fi

      - name: Build and smoke-test the ARM64 release in Debian Trixie
        id: build_trixie_release
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            --file deploy/docker/Dockerfile \
            --target release-smoke \
            --build-arg "BUN_VERSION=$(cat .bun-version)" \
            --build-arg "LUMI_RELEASE_COMMIT=$GITHUB_SHA" \
            --load \
            --tag "lumistripe-release-smoke:$GITHUB_SHA" \
            .
          mkdir -p "$RUNNER_TEMP/lumistripe-release"
          release_container="$(docker create "lumistripe-release-smoke:$GITHUB_SHA")"
          docker cp "$release_container:/release" "$RUNNER_TEMP/lumistripe-release/"
          docker cp "$release_container:/release-build-info.json" \
            "$RUNNER_TEMP/lumistripe-release/release-build-info.json"
          docker rm "$release_container"
          release_dir="$RUNNER_TEMP/lumistripe-release/release"
          test "$(cat "$release_dir/source-commit")" = "$GITHUB_SHA"
          test -s "$release_dir/static/index.html"

      - name: Package deterministic release archive and manifest
        id: package_release
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/lumistripe-release/release"
          archive_name="lumistripe-linux-aarch64-$GITHUB_SHA.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          uv run --no-project --python 3.12 python deploy/release_artifact.py package \
            --release-dir "$release_dir" \
            --output "$archive" \
            --commit "$GITHUB_SHA" \
            --project-root "$GITHUB_WORKSPACE" \
            --build-info "$RUNNER_TEMP/lumistripe-release/release-build-info.json"
          cp "$release_dir/manifest.json" "$archive.manifest.json"
          (cd "$RUNNER_TEMP" && sha256sum "$archive_name" > "$archive_name.sha256")
          echo "LUMI_RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Validate and smoke-test the packaged ARM64 release
        id: validate_release
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/lumistripe-release/release"
          archive="$RUNNER_TEMP/lumistripe-linux-aarch64-$GITHUB_SHA.tar.gz"
          uv run --no-project --python 3.12 python deploy/release_artifact.py validate \
            --release-dir "$release_dir" \
            --commit "$GITHUB_SHA" \
            --origin github \
            --check-runtime
          cmp "$release_dir/manifest.json" "$archive.manifest.json"
          (cd "$RUNNER_TEMP" && sha256sum --check "${archive##*/}.sha256")
          uv run --no-project --python 3.12 python deploy/release_smoke.py \
            --release-dir "$release_dir" \
            --commit "$GITHUB_SHA" \
            --image "lumistripe-release-smoke:$GITHUB_SHA" \
            --require-manifest

      - name: Build Ubuntu 26.04 ARM64 runtime compatibility image
        id: build_ubuntu_runtime
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file deploy/docker/release-ubuntu-compatibility.Dockerfile \
            --load \
            --tag "lumistripe-release-ubuntu-compat:$GITHUB_SHA" \
            .

      - name: Verify the release on Ubuntu 26.04 ARM64
        id: verify_ubuntu_runtime
        run: |
          set -eu
          uv run --no-project --python 3.12 python deploy/release_smoke.py \
            --release-dir "$RUNNER_TEMP/lumistripe-release/release" \
            --commit "$GITHUB_SHA" \
            --image "lumistripe-release-ubuntu-compat:$GITHUB_SHA" \
            --require-manifest

      - name: Attest release archive provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.LUMI_RELEASE_ARCHIVE }}

      - name: Verify release provenance
        id: verify_provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          archive="$LUMI_RELEASE_ARCHIVE"
          archive_name="${archive##*/}"
          checksum="$archive.sha256"
          manifest="$archive.manifest.json"
          bundle="${archive}.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "$bundle"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --bundle "$bundle"
          echo "LUMI_RELEASE_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Generate release qualification report
        if: ${{ always() }}
        env:
          DEPLOYMENT_TEST_RESULT: ${{ needs.deployment-tests.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend.result }}
          RUST_X86_TEST_RESULT: ${{ needs.rust-engine.result }}
          RUST_ARM64_TEST_RESULT: ${{ needs.rust-engine-arm64.result }}
          RELEASE_SOURCE_RESULT: ${{ steps.verify_release_source.outcome || 'skipped' }}
          TRIXIE_RESULT: ${{ steps.build_trixie_release.outcome || 'skipped' }}
          PACKAGE_RESULT: ${{ steps.package_release.outcome || 'skipped' }}
          VALIDATE_RESULT: ${{ steps.validate_release.outcome || 'skipped' }}
          UBUNTU_BUILD_RESULT: ${{ steps.build_ubuntu_runtime.outcome || 'skipped' }}
          UBUNTU_VERIFY_RESULT: ${{ steps.verify_ubuntu_runtime.outcome || 'skipped' }}
          ATTEST_RESULT: ${{ steps.attest.outcome || 'skipped' }}
          VERIFY_PROVENANCE_RESULT: ${{ steps.verify_provenance.outcome || 'skipped' }}
        run: |
          set -eu
          combine_results() {
            saw_skipped=0
            for result in "$@"; do
              case "$result" in
                failure|cancelled) echo failure; return ;;
                success) ;;
                *) saw_skipped=1 ;;
              esac
            done
            if [ "$saw_skipped" -eq 0 ]; then echo success; else echo skipped; fi
          }
          release_report_dir="$RUNNER_TEMP/release-qualification"
          release_dir="$RUNNER_TEMP/lumistripe-release/release"
          report_args=()
          if [ -f "$release_dir/manifest.json" ]; then
            report_args+=(--release-dir "$release_dir")
          fi
          uv run --no-project --python 3.12 python deploy/release_qualification.py \
            --project-root "$GITHUB_WORKSPACE" \
            "${report_args[@]}" \
            --commit "$GITHUB_SHA" \
            --deployment-tests "$DEPLOYMENT_TEST_RESULT" \
            --frontend-tests "$FRONTEND_TEST_RESULT" \
            --rust-x86-tests "$RUST_X86_TEST_RESULT" \
            --application-tests "${{ needs.rust-engine.outputs.application-tests || needs.rust-engine.result }}" \
            --stability-tests "${{ needs.rust-engine.outputs.extended-stability || 'skipped' }}" \
            --rust-arm64-tests "$RUST_ARM64_TEST_RESULT" \
            --release-source "$RELEASE_SOURCE_RESULT" \
            --release-smoke "$(combine_results "$TRIXIE_RESULT" "$VALIDATE_RESULT")" \
            --trixie-runtime "$TRIXIE_RESULT" \
            --ubuntu-2604-runtime "$(combine_results "$UBUNTU_BUILD_RESULT" "$UBUNTU_VERIFY_RESULT")" \
            --artifact-integrity "$(combine_results "$PACKAGE_RESULT" "$VALIDATE_RESULT")" \
            --provenance "$(combine_results "$ATTEST_RESULT" "$VERIFY_PROVENANCE_RESULT")" \
            --target-architecture aarch64 \
            --target-triple aarch64-unknown-linux-gnu \
            --build-environment "GitHub-hosted ARM64 runner with Debian Trixie ARM64 build and runtime containers" \
            --output-dir "$release_report_dir"
          cat "$release_report_dir/release-qualification.md" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload release qualification report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/release-qualification/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          archive="$LUMI_RELEASE_ARCHIVE"
          archive_name="${archive##*/}"
          checksum="$archive.sha256"
          manifest="$archive.manifest.json"
          bundle="$LUMI_RELEASE_BUNDLE"

          tag="build-$GITHUB_SHA"
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "LumiStripe $GITHUB_SHA" \
            --notes "Commit-matched ARM64 Debian Trixie deployment bundle." \
            "$archive" "$checksum" "$bundle" "$manifest"

          expected_assets="$(printf '%s\n' "$archive_name" "$archive_name.sha256" "$archive_name.sigstore.json" "$archive_name.manifest.json" | jq -R . | jq -s 'sort')"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable,assets \
            | jq -e --arg tag "$tag" --argjson assets "$expected_assets" \
              'select(.tagName == $tag and .isDraft == true and ([.assets[].name] | sort == $assets))' \
            >/dev/null
          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable \
            | jq -e --arg tag "$tag" \
              'select(.tagName == $tag and .isDraft == false and .isImmutable == true)' \
            >/dev/null
