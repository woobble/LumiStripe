      - name: Benchmark Rust effect layers and allocation counts on Raspberry Pi 5
        run: |
          set -eu
          uv run --locked python scripts/benchmark_rust_catalog.py \
            --rust-binary llvm="$RUNNER_TEMP/lumistripe-rust-renderer-llvm/release/examples/benchmark_render" \
            --rust-binary scalar="$RUNNER_TEMP/lumistripe-rust-renderer-scalar/release/examples/benchmark_render" \
            --pixels 300 --frames 1000 --warmup 200 --audio --fail-on-allocation \
            --output "$RUNNER_TEMP/lumistripe-rust-renderer-benchmarks/effects-and-allocations.json"

      - name: Record Raspberry Pi renderer benchmark environment
        if: always()
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/lumistripe-rust-renderer-benchmarks"
          {
            git rev-parse HEAD
            uname -a
            if test -r /proc/device-tree/model; then
              printf 'board_model='
              tr -d '\000' < /proc/device-tree/model
              printf '\n'
            fi
            awk -F: '/^(Hardware|Model|CPU implementer|CPU part|Revision)[[:space:]]*:/ { print }' /proc/cpuinfo
            if test -r /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor; then
              printf 'cpu_governor='
              cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
            else
              printf 'cpu_governor=unavailable\n'
            fi
            for temperature_file in /sys/class/thermal/thermal_zone*/temp; do
              if test -r "$temperature_file"; then
                printf '%s=' "$temperature_file"
                awk '{ printf "%.3f C\n", $1 / 1000 }' "$temperature_file"
              fi
            done
            if command -v rustc >/dev/null 2>&1; then rustc -vV; else echo 'rustc=unavailable'; fi
            if command -v cc >/dev/null 2>&1; then cc --version; else echo 'cc=unavailable'; fi
            if command -v uv >/dev/null 2>&1; then
              uv --version
              uv run --locked python -c 'import platform, sys; print(sys.version); print(platform.platform()); print(platform.processor())'
            else
              echo 'uv=unavailable'
            fi
          } > "$RUNNER_TEMP/lumistripe-rust-renderer-benchmarks/environment.txt"

      - name: Upload Raspberry Pi renderer benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raspberry-pi-5-renderer-benchmarks-${{ github.run_id }}
          path: ${{ runner.temp }}/lumistripe-rust-renderer-benchmarks/
          if-no-files-found: warn
          retention-days: 30
