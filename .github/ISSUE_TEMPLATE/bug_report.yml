name: Bug report
description: Report a reproducible problem with LumiStripe.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and remove sensitive pairing codes, hostnames, or logs before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core animation engine
        - CLI or simulator
        - Web dashboard or API
        - Frontend
        - Raspberry Pi deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. main at abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable reproduction.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python/Bun versions, and hardware/audio details when relevant.
    validations:
      required: true
