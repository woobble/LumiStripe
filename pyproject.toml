[tool.uv.workspace]
members = [
    "packages/lumistripe-core",
    "packages/lumistripe-app-support",
    "apps/lumistripe-cli",
    "apps/lumistripe-sim",
    "apps/lumistripe-web",
]

[tool.uv.sources]
lumistripe-core = { workspace = true }
lumistripe-app-support = { workspace = true }
lumistripe-cli = { workspace = true }
lumistripe-sim = { workspace = true }
lumistripe-web = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.12",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "--cov=lumistripe",
    "--cov=lumistripe_cli",
    "--cov=lumistripe_sim",
    "--cov=lumistripe_web",
    "--cov=lumistripe_app_support",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = [
    "lumistripe",
    "lumistripe_cli",
    "lumistripe_sim",
    "lumistripe_web",
    "lumistripe_app_support",
]
omit = [
    "*/tests/*",
    "*/build/*",
    "third_party/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
exclude = [
    "packages/lumistripe-core/src/lumistripe/audio/kissfft/",
]

[tool.ruff]
extend-exclude = ["third_party"]
