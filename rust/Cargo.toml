[workspace]
members = [
    "apps/lumistripe-engine",
    "crates/lumistripe-engine-config",
    "crates/lumistripe-engine-output",
    "crates/lumistripe-engine-protocol",
    "crates/lumistripe-engine-runtime",
    "crates/lumistripe-engine-render-primitives",
    "crates/lumistripe-engine-animation-definitions",
    "crates/lumistripe-engine-animation-state",
    "crates/lumistripe-engine-compositing",
    "crates/lumistripe-engine-effects",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spidev = "0.7.1"
gpio-cdev = "0.6"
libc = "0.2"
lumistripe-engine-config = { path = "crates/lumistripe-engine-config" }
lumistripe-engine-output = { path = "crates/lumistripe-engine-output" }
lumistripe-engine-protocol = { path = "crates/lumistripe-engine-protocol" }
lumistripe-engine-runtime = { path = "crates/lumistripe-engine-runtime" }
lumistripe-engine-render-primitives = { path = "crates/lumistripe-engine-render-primitives" }
lumistripe-engine-animation-definitions = { path = "crates/lumistripe-engine-animation-definitions" }
lumistripe-engine-animation-state = { path = "crates/lumistripe-engine-animation-state" }
lumistripe-engine-compositing = { path = "crates/lumistripe-engine-compositing" }
lumistripe-engine-effects = { path = "crates/lumistripe-engine-effects" }
