# Keep Spotify audio in a dedicated sink. LumiStripe creates a loopback from
# this sink's monitor to the selected physical output when Spotify input is
# enabled, while sounddevice captures the monitor for animation analysis.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "lumistripe_spotify"
      node.description = "LumiStripe Spotify"
      node.virtual = true
      media.class = "Audio/Sink"
      audio.position = [ FL FR ]
      monitor.channel-volumes = true
      monitor.passthrough = true
    }
  }
]
