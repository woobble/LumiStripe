# LumiStripe supports both A2DP directions. Phones can send music to the Pi,
# while Bluetooth speakers can receive the Pi's routed audio output. LumiStripe
# captures the playback monitor for animation analysis.

# The dashboard is a headless party appliance. Allow its user service to own
# Bluetooth audio even when no graphical logind session is active.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role = "playback"
      }
    }
  }
]

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
