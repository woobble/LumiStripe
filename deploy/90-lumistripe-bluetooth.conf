# LumiStripe uses the Pi as an A2DP receiver. Keep the incoming phone stream
# as playback audio so WirePlumber sends it to the configured physical sink.
# LumiStripe captures the corresponding bluez monitor source for animation
# analysis through the PipeWire/Pulse compatibility layer.

# The dashboard is a headless party appliance. Allow its user service to own
# Bluetooth audio even when no graphical logind session is active.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role = "playback"
      }
    }
  }
]

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}
