# LumiStripe captive-portal HTTP redirect and HTTPS reverse proxy.
# Copy/install this file to /etc/nginx/sites-available/led-controller.

server {
    listen 0.0.0.0:80 default_server;
    server_name led.controller _;

    access_log /var/log/nginx/led-captive-access.log;
    error_log /var/log/nginx/led-captive-error.log;

    location = /hotspot-detect.html {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED Controller</title></head><body><h1>LED Controller</h1><p>Opening controller...</p><script>window.location.replace("https://led.controller/");</script><p><a href="https://led.controller/">Open LED controller</a></p></body></html>';
    }

    location = /captive-portal/api {
        default_type application/captive+json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        return 200 '{"captive":true,"user-portal-url":"https://led.controller/"}';
    }

    location / {
        return 301 https://led.controller$request_uri;
    }
}

server {
    listen 0.0.0.0:443 ssl;
    server_name led.controller;

    # Avoid proxy header hash warnings on Debian/Raspberry Pi Nginx builds.
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    access_log /var/log/nginx/led-access.log;
    error_log /var/log/nginx/led-error.log;

    ssl_certificate /etc/nginx/certs/led.controller.pem;
    ssl_certificate_key /etc/nginx/certs/led.controller-key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
