[package]
name = "lumistripe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-engine = ["dep:lumistripe-engine-runtime"]

[[bin]]
name = "lumistripe"
path = "src/main.rs"

[dependencies]
clap.workspace = true
gpio-cdev.workspace = true
libc.workspace = true
lumistripe-engine-animation-definitions.workspace = true
lumistripe-engine-audio.workspace = true
lumistripe-engine-client.workspace = true
lumistripe-engine-config.workspace = true
lumistripe-engine-protocol.workspace = true
lumistripe-engine-runtime = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[bin]]
name = "lumistripe-cli-test-engine"
path = "tests/support/engine.rs"
required-features = ["test-engine"]
test = false
bench = false

[[test]]
name = "python_unavailable"
path = "tests/python_unavailable.rs"
required-features = ["test-engine"]
