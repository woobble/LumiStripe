[package]
name = "lumistripe-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
bluez = ["dep:bluer"]
pipewire = ["dep:pipewire"]

[[bin]]
name = "lumistripe-web"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
libc.workspace = true
lumistripe-engine-audio.workspace = true
lumistripe-engine-animation-definitions.workspace = true
lumistripe-engine-config.workspace = true
lumistripe-engine-protocol.workspace = true
lumistripe-engine-runtime.workspace = true
lumistripe-spotify.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true, features = ["bluetoothd"], optional = true }
pipewire = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
lumistripe-engine-client.workspace = true
tower.workspace = true
